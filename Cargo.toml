[workspace]
resolver = "3"
members = [".", "gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ken Sykes"]
repository = "https://github.com/KenSykes/decoderant-a64"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
# Without `std`: the library is `no_std`, and thiserror 2 implements
# `core::error::Error` either way. (Cargo 1.88, the MSRV, rejects turning default
# features off in a member when the workspace entry has them on.)
thiserror = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "decoderant-a64"
description = "A64 (AArch64) decoder, encoder, formatter and instruction info generated from Arm's machine-readable specification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
# The code is MIT; the generated tables are derived from Arm's BSD-3-Clause AARCHMRS.
license = "MIT AND BSD-3-Clause"
homepage = "https://github.com/KenSykes/decoderant-a64"
documentation = "https://docs.rs/decoderant-a64"
readme = "README.md"
keywords = ["aarch64", "arm64", "disassembler", "assembler", "decoder"]
categories = ["no-std", "development-tools::debugging", "encoding", "hardware-support", "emulators"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-AARCHMRS",
    "/THIRD_PARTY_NOTICES",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "encoder", "instr_info", "formatter"]
std = []
encoder = []
instr_info = []
formatter = []
code_asm = ["encoder"]

[dependencies]
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Independent oracles for the differential tests (hand-written decode trees).
fARM64 = { version = "0.1", features = ["alloc", "crypto", "sve", "sme"] }
yaxpeax-arm = "0.5"
yaxpeax-arch = { version = "0.3", default-features = false }

# Targets that need more than the decoder name the features they use, so that
# builds with other feature sets skip them rather than fail.
[[test]]
name = "code_asm"
required-features = ["code_asm", "formatter", "std"]

[[test]]
name = "encoder"
required-features = ["encoder", "formatter", "std"]

[[test]]
name = "fingerprint"
required-features = ["encoder", "formatter", "instr_info", "std"]

[[test]]
name = "golden"
required-features = ["encoder", "formatter", "std"]

[[test]]
name = "info"
required-features = ["formatter", "instr_info", "std"]

[[test]]
name = "oracles"
required-features = ["formatter", "std"]

[[test]]
name = "sweep"
required-features = ["encoder", "formatter", "std"]

[[bench]]
name = "decode"
harness = false
required-features = ["encoder", "formatter", "instr_info", "std"]

[[example]]
name = "compare"
required-features = ["formatter", "std"]

[[example]]
name = "dis"
required-features = ["formatter", "std"]
